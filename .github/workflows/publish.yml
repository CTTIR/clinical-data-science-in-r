name: Render and publish book
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: '1.10.19'
      # R results come from the committed _freeze/ directory. R itself is only needed with
      # knitr and rmarkdown for the EPUB assembly; chapter code is not re-run, and a changed
      # chapter without an updated _freeze/ fails because its packages are missing.
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'
      - run: quarto render
      - name: Check output
        run: |
          test -f _book/index.html
          test -f _book/chapters/b09-fracture-alert-emergency-department.html
          if grep -rl '?@sec\|?@tbl\|?@fig' _book --include=*.html; then exit 1; fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _book
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
